<div
  class="min-h-screen bg-gradient-to-br from-indigo-700 via-indigo-600 to-purple-700 flex items-center justify-center px-4"
>
  <div class="w-full max-w-md">
    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <div class="text-center mb-6">
        <div
          class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-600 mb-3"
        >
          <svg
            class="h-6 w-6 text-white"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Create Account</h1>
        <p class="text-sm text-gray-500 mt-1">
          U P Awas Evam Vikas Parishad Payment Portal
        </p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Full Name</label
          >
          <input
            [(ngModel)]="form.name"
            type="text"
            placeholder="Enter your full name"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Email Address</label
          >
          <input
            [(ngModel)]="form.email"
            type="email"
            placeholder="you@example.com"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Password</label
          >
          <input
            [(ngModel)]="form.password"
            type="password"
            placeholder="Min. 6 characters"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          />
        </div>

        <div
          *ngIf="error"
          class="rounded-lg bg-red-50 border border-red-200 px-4 py-2.5 text-sm text-red-600"
        >
          {{ error }}
        </div>

        <button
          (click)="submit()"
          [disabled]="loading"
          class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-lg hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center justify-center gap-2"
        >
          <span
            *ngIf="loading"
            class="h-4 w-4 border-2 border-white border-t-transparent rounded-full animate-spin"
          ></span>
          {{ loading ? 'Creating account…' : 'Register' }}
        </button>
      </div>

      <p class="text-center text-sm text-gray-500 mt-5">
        Already have an account?
        <a
          [routerLink]="['/user-login']"
          class="text-indigo-600 font-medium hover:underline"
          >Sign in</a
        >
      </p>
      <p class="text-center text-sm text-gray-400 mt-2">
        <a [routerLink]="['/']" class="hover:underline">← Back to home</a>
      </p>
    </div>
  </div>
</div>

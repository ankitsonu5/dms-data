<div
  class="min-h-screen bg-gradient-to-br from-indigo-700 via-indigo-600 to-purple-700 flex items-center justify-center px-4"
>
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <div class="text-center mb-6">
        <div
          class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-600 mb-3"
        >
          <svg
            class="h-6 w-6 text-white"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"
            />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Forgot Password?</h1>
        <p class="text-sm text-gray-500 mt-1">
          Enter your email — we'll send a reset link
        </p>
      </div>

      <!-- Success state -->
      <div *ngIf="success" class="text-center space-y-4">
        <div
          class="inline-flex h-14 w-14 items-center justify-center rounded-full bg-green-100 mx-auto"
        >
          <svg
            class="h-7 w-7 text-green-600"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5 13l4 4L19 7"
            />
          </svg>
        </div>
        <p class="text-gray-700 text-sm">
          If this email is registered, a password reset link has been sent.
          Check your inbox.
        </p>
        <a
          [routerLink]="['/user-login']"
          class="block w-full bg-indigo-600 text-white text-sm font-semibold py-2.5 rounded-lg text-center hover:bg-indigo-700 transition-colors"
        >
          Back to Sign In
        </a>
      </div>

      <!-- Form -->
      <div *ngIf="!success" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Email Address</label
          >
          <input
            [(ngModel)]="email"
            type="email"
            placeholder="you@example.com"
            (keyup.enter)="submit()"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          />
        </div>

        <div
          *ngIf="error"
          class="rounded-lg bg-red-50 border border-red-200 px-4 py-2.5 text-sm text-red-600"
        >
          {{ error }}
        </div>

        <button
          (click)="submit()"
          [disabled]="loading"
          class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-lg hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center justify-center gap-2"
        >
          <span
            *ngIf="loading"
            class="h-4 w-4 border-2 border-white border-t-transparent rounded-full animate-spin"
          ></span>
          {{ loading ? 'Sending…' : 'Send Reset Link' }}
        </button>

        <p class="text-center text-sm text-gray-500">
          <a
            [routerLink]="['/user-login']"
            class="text-indigo-600 hover:underline"
            >← Back to Sign In</a
          >
        </p>
      </div>
    </div>
  </div>
</div>

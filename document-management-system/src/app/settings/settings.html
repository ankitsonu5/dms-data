<div class="space-y-6">
  <div class="rounded-xl border bg-white p-4 shadow-sm">
    <h2 class="text-lg font-semibold mb-3">Reset User Password</h2>
    <p class="text-sm text-gray-600 mb-3">
      Directly set a new password for a user.
    </p>
    <div class="space-y-3">
      <input
        [(ngModel)]="email"
        type="email"
        placeholder="User email"
        class="w-full border rounded px-3 py-2"
      />
      <input
        [(ngModel)]="password"
        type="password"
        placeholder="New password"
        class="w-full border rounded px-3 py-2"
      />
      <input
        [(ngModel)]="confirmPassword"
        type="password"
        placeholder="Confirm new password"
        class="w-full border rounded px-3 py-2"
      />
      <button
        (click)="resetPassword()"
        [disabled]="pending || !email || !password || !confirmPassword"
        class="bg-indigo-600 text-white rounded px-4 py-2 w-full disabled:opacity-50"
      >
        {{ pending ? 'Resetting…' : 'Reset Password' }}
      </button>
    </div>
    <div
      *ngIf="message"
      class="mt-3 text-sm"
      [class.text-green-700]="ok"
      [class.text-red-600]="!ok"
    >
      {{ message }}
    </div>
  </div>
</div>
